defaults:
  - _self_

experiment:
  name: loso_LR_controlled_E4
        #E4_feature_downweighting
        #E_seen_feature_comparison
        #E5_frequency_matched_random 
        #E3_autocut_site_cod_features 
        #E2_autocut_top_site_features 
        #module_influence_on_site 
        #loso_LR_controlled 
        #site_prediction 
        #loso_LR
  adult_only: false
  filter_voc: false

feature_filter:
  ordering_method: site_first_protected #cod_first
  random_repeats: 10
  e2_removed_features_path: output/E2_autocut_top_site_features/2026-11-21_19-27-44/e2_removed_features.csv

controlled_loso:
  min_count: 10
  eval_fraction: 0.20
  seeds: [42, 123, 456, 789, 2026, 11, 17, 23, 31, 47,
          59, 71, 83, 97, 109, 127, 139, 151, 163, 179,
          191, 211, 223, 239, 251, 269, 281, 307, 331, 347]
          
data:
  text_column: open_response_clean
  target_column: gs_text34
  site_column: site

vectorizer:
  max_features: 5000
  ngram_range: [1, 3]

svd:
  n_components: 300
  random_state: 42

classifier:
  max_iter: 2000
  class_weight: balanced
  c_values: [0.01, 0.1, 1, 10, 100]

validation:
  n_splits: 3
  scoring: f1_macro

hydra:
  run:
    dir: output/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
