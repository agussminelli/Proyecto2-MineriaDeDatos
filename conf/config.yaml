defaults:
  - _self_

experiment:
  name: loso_LR_controlled
  adult_only: false
  filter_voc: true

controlled_loso:
  min_count: 10
  eval_fraction: 0.20
  seeds: [42, 123, 456, 789, 2026, 11, 17, 23, 31, 47,
          59, 71, 83, 97, 109, 127, 139, 151, 163, 179,
          191, 211, 223, 239, 251, 269, 281, 307, 331, 347]
          
data:
  text_column: open_response_clean
  target_column: gs_text34
  site_column: site

vectorizer:
  max_features: 5000
  ngram_range: [1, 3]

svd:
  n_components: 300
  random_state: 42

classifier:
  max_iter: 2000
  class_weight: balanced
  c_values: [0.01, 0.1, 1, 10, 100]

validation:
  n_splits: 3
  scoring: f1_macro

hydra:
  run:
    dir: output/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
